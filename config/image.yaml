# 资产图（人物／道具／场景参考图）走哪个生图模型（issue #87 / spec #84 D8）。
#
# 三档各选一个：z_image / qwen / moss。选中值同时决定出词请求追加哪一份纪律块
# （prompts/image_prompt_disciplines/<模型>.md）——**换模型必须同时换纪律**：
# 同一个模型换错纪律，出来的词会按另一家的写法写（Z-Image 要中文短句、Qwen 要英文长文、
# MOSS 要英文＋负面标签），产物照样生成、只是质量掉一档，不报错。
#
# 默认：人物 Qwen、道具与场景 Z-Image（spec #84 D8 的外部调研结论：人物参考／转身板
# Qwen 强，Z-Image 弱，MOSS 不支持 reference）。
#
# 配置是**每张资产的起点，不是最终裁定**（issue #88）：
#   - 自动路由：该类的设计正文或该资产提示词命中文字类关键词（标签/招牌/包装/logo/文字/
#     海报）时切到 MOSS 重出词，终端会打印命中词。设计正文是整类共用的一段，故它命中时
#     该类的**每一张**都切；只有提示词里命中的那张才单张切换。
#   - 素材循环的审查菜单可以逐张改模型（6=改这张的生图模型），手动选择压过上面那条规则，
#     并记进会话（阶段 1 重跑也保留）。想给某一类整体换档，改这里仍是唯一入口。
#
# ⚠ 许可红线：Qwen-Image 2.1 是 Qwen Research License，**仅限非商用**。
#   商用前把 character 切到 z_image 或 moss（Z-Image / MOSS 为 Apache-2.0）。

character: qwen
prop: z_image
scene: z_image

# 关键帧（首帧/尾帧）用哪个生图模型。**这不是第四档资产**：它只决定关键帧提示词按
# 哪一档的写词纪律出、按哪一档的画布给构图——三档资产分配管的是人物/道具/场景参考图。
# 可选值与上面相同（z_image / qwen / moss），缺省 qwen（2026-10-30 用户裁定：
# 本地三个模型里关键帧用 Qwen-Image 2.1，要英文长文、不写负面）。
# 写错值会大声报错：静默回默认会让你以为换了、实际一直按旧档出词。
frame: qwen
