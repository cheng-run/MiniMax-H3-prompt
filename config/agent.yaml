# MiniMax-H3 多智能体提示词生成系统 — 管线配置
pipeline:
  default_duration: 5        # 单段视频默认时长（秒），H3 常见单片段
  max_qa_iterations: 2       # 质检回退最大轮数
  max_clarification_rounds: 3  # 起步前置澄清最多问几个问题（0 = 关闭澄清）
  roundtable_max_rounds: 2   # 圆桌讨论最大轮数
  output_path: output/final_prompt.txt
  save_stages: true          # 每个角色/阶段的产物落盘 output/stages/
  stages_path: output/stages
  common_sense_qa: true      # 生图/视频提示词日常常识 QA（每代一次 LLM 审核；false 关闭省成本）

# token 费用估算单价（元 / 百万 token），用于交互界面展示成本，可按实际改
cost:
  price_per_m_input: 0.5
  price_per_m_output: 1.5

# 模型配置：只放非敏感项，API key 仍放项目根 .env。
# 旧的 provider-specific *_MODEL / *_BASE_URL 环境变量仍可覆盖这里的值。
models:
  primary:
    # provider: deepseek
    # model: deepseek-v4-flash
    # base_url: https://api.deepseek.com/v1
    # api_key_env: DEEPSEEK_API_KEY

    provider: dashscope
    model: MiniMax-M3.1-Flash
    base_url: https://api.minimax.cn/v1
    api_key_env: MINIMAX_API_KEY

  vision:
    provider: dashscope
    model: MiniMax-M3.1-Flash
    # 网关 OpenAI 兼容口只有 /v1；多打一个 1（/v11）会被 nginx 直接 404，
    # 读图两端（首帧/多参）都会挂（2026-10-24 实测）
    base_url: https://api.minimax.cn/v1
    api_key_env: MINIMAX_API_KEY

# 旧字段：仅在新模型配置和兼容环境变量都未提供模型名时作为 fallback。
# model: ""

# 导演台路线（issue #104）：导演包的画布与参考图参数。
# 宽高必须是 32 的倍数（MiniMax H3 画布按 32 对齐，后端会拒绝非对齐尺寸），
# 打包与配置读取时各校验一次；ref_image_size 只认 match / max（官方节点口径），
# ref_max_size 是导演台节点的 ref_max_size 默认值。
director:
  width: 736
  height: 1280
  ref_max_size: 864
  # match = 参考图按生成尺寸缩放（插件与官方节点的默认值，2026-10-29 用户裁定）；
  # max = 按 ref_max_size 上限送图，参考图更清晰但更费显存。改这一行即可切换。
  ref_image_size: "match"
  # ComfyUI 输出目录（issue #105）：段缓存落在 <这里>/minimax_seg_cache/<缓存名>_<节点id>/。
  # 换机器不用改这份文件：环境变量 H3_COMFY_OUTPUT_ROOT 优先级更高。
  comfy_output_root: "D:/Comfyui/ComfyUI/output"
  # 有引导段允许的「实际比计划少」的帧数（issue #105，设计 §3.7）。默认值住在
  # director/companion.py 的 DIRECTOR_FRAME_TOLERANCE（判据真源）；写在这里是给用户的
  # 旋钮，删掉这一行就回落到那个常量。
  frame_tolerance: 5

defaults:
  style: "Cinematic"
  language: "Chinese"
  sessions_root: "output/sessions"   # 两阶段向导会话落盘/关键帧暂存根目录（项目内）
