# 多参（ref2va）路线的工作流登记与参考槽位数（issue #65 / ADR 0017）。
# 与 config/agent.yaml（模型侧）分开：换模型不该误改槽位，换工作流才改这里。
#
# 槽位数＝工作流节点的**物理端口数**（端口名 ref_image_0 … ref_image_{N-1}）。
# 改这里之前先有对应端口的工作流：数字跟着工作流走，不是反过来——把数字调大
# 而工作流没有端口，照卡接线会接进空气（ADR 0017 的原始事故）。
# 缺文件或缺字段时，读取口回落图 9 / 视频 3 / 音频 3，不崩溃。
#
# 2026-10-25（issue #86 / spec #84 D5）：登记回到 V2 的 **9 图槽**版本。9 不是节点 UI
# 上限而是**官方 API 的单次请求上限**（≤9 图 + ≤3 视频 + ≤3 音频、总文件 ≤12）；24 槽
# V3 从一开始就不该是默认路径——24 张全喂时 Qwen3-VL 序列约 5.4 万 token，16GB 卡上
# 朴素注意力 `einsum` 要 232 GiB（2026-10-22 实测 OOM）。V3 工作流随 T6 退役。

# 登记工作流名（注入卡、菜单、文档守卫的单一来源）。
ref_workflow_name: "59-(多Lora改)MiniMax-H3 ref2va 多参生视频 V2"

slots:
  picture: 9
  video: 3
  audio: 3

# 每个执行段真正喂几张参考图（issue #75）：段内只保留本段 Shot 用到的素材并重编号。
# 与上面的 picture 槽位数是两件事——槽位是工作流端口数（9），这是单次生成喂几张。
# 缺省 9，且**不会超过官方的 9 图上限**（`segment_refs.compute_segment_scope` 取两者
# 的较小值，issue #86）：把这里调大不会让单次请求合法，只会让卡与工作流对不上。
refs_per_segment: 9
