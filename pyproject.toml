[project]
name = "minimax-h3-prompt"
version = "0.1.0"
description = "MiniMax-H3 多智能体提示词生成系统：LangGraph+LangChain+deepagents 编排电影制作+AIGC 双流程，产出官方规范 H3 提示词"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.6",
    "fastapi>=0.162.2",
    "imageio-ffmpeg>=0.6.0",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.33",
    "pywebview==6.2.1",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "typer>=0.27.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "playwright>=1.65.0",
    "pyinstaller==6.22.3",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# 并行票据工作树住在仓库根 worktree/ 下（见 .gitignore），而 pytest 默认从 rootdir
# 递归收集——它不看 .gitignore，会把工作树里的测试副本一并收进来，撞出重复模块名
# 与导入错（2026-10-18 合并期实测 184 errors）。限定只收 tests/，让本仓既有的
# 「主树裸跑 pytest -q」口径在开工作树时继续成立。
testpaths = ["tests"]
# tests/conftest.py 的 no_real_network 是 autouse 的出网守卫；标了 allow_network 的
# 用例才会被放行。注册在这里是为了让「用了什么标记」可查——未注册的标记默认静默通过。
markers = [
    "allow_network: 允许该用例建立真实网络连接（默认全部禁止，见 conftest.no_real_network）",
]
# 单条用例上限（秒）。卡死时要以「哪个用例超时」收场，而不是让整台机器被换页拖垮：
# 2026-11-08 实测一条卡住的全量吃到 24 GB 工作集 / 95 GB 私有提交，可用内存掉到 1.4 GB，
# 全程没有任何信号指出是哪条用例。这条只在装了 pytest-timeout 时生效——未装时
# `scripts/check.sh` 会显式提示（安装由用户执行：uv add --dev pytest-timeout）。
timeout = 300

[tool.mypy]
# 体检 P6（2026-11-02）：先只查**叶子模块**——它们没有项目内循环依赖，注解能真
# 表达出来；一次性放开全仓会刷出上千条历史错误，把新错误一起淹掉。
# 安装由用户本人执行：uv add --dev mypy（scripts/check.sh types 会先看有没有装）。
python_version = "3.14"
files = ["src/minimax_h3_prompt"]
# 2026-11-02 六批推进到这里：全仓 72 个源文件零错误（第一批 4 个叶子模块起步，
# 每一批修到绿再加下一批）。之前那份白名单式的 files 列表已不再需要——留着它
# 反而会漏掉新增文件。
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
# 体检 P6：覆盖率先只做**度量**，不设门槛——本仓的历史基线没有，设 fail_under
# 只会逼人写凑数用例。改了哪几行、哪几行没测到，才是评审要看的东西。
# 安装由用户本人执行：uv add --dev coverage
source = ["src/minimax_h3_prompt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise SystemExit",
]

[tool.ruff]
# retro 2026-10-31：把机械风格/导入错误交给确定性工具，不再只靠复审子代理。
# 只查 src/；tests/ 的规则先跑通再扩（tests/ 已于 2026-11-02 入库）。规则先取 pyflakes（F）——它抓未定义名、
# 未使用导入这类真错误，不会像 E501 那样一次刷满全仓历史文件。
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["F"]
