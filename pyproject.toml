[project]
name = "minimax-h3-prompt"
version = "0.1.0"
description = "MiniMax-H3 多智能体提示词生成系统：LangGraph+LangChain+deepagents 编排电影制作+AIGC 双流程，产出官方规范 H3 提示词"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.6",
    "imageio-ffmpeg>=0.6.0",
    "langchain>=1.3.15",
    "langchain-anthropic>=1.5.6",
    "langchain-openai>=1.5.0",
    "langgraph>=1.2.11",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "typer>=0.27.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
# 并行票据工作树住在仓库根 worktree/ 下（见 .gitignore），而 pytest 默认从 rootdir
# 递归收集——它不看 .gitignore，会把工作树里的测试副本一并收进来，撞出重复模块名
# 与导入错（2026-10-18 合并期实测 184 errors）。限定只收 tests/，让本仓既有的
# 「主树裸跑 pytest -q」口径在开工作树时继续成立。
testpaths = ["tests"]
# tests/conftest.py 的 no_real_network 是 autouse 的出网守卫；标了 allow_network 的
# 用例才会被放行。注册在这里是为了让「用了什么标记」可查——未注册的标记默认静默通过。
markers = [
    "allow_network: 允许该用例建立真实网络连接（默认全部禁止，见 conftest.no_real_network）",
]

[tool.mypy]
# 体检 P6（2026-11-02）：先只查**叶子模块**——它们没有项目内循环依赖，注解能真
# 表达出来；一次性放开全仓会刷出上千条历史错误，把新错误一起淹掉。
# 安装由用户本人执行：uv add --dev mypy（scripts/check.sh types 会先看有没有装）。
python_version = "3.14"
files = [
    "src/minimax_h3_prompt/errors.py",
    "src/minimax_h3_prompt/kinds.py",
    "src/minimax_h3_prompt/text_patterns.py",
    "src/minimax_h3_prompt/observability.py",
    # 第二批（2026-11-02）：纯逻辑叶子 + 已修到绿的边界模块。
    "src/minimax_h3_prompt/ref_capacity.py",
    "src/minimax_h3_prompt/image_routing.py",
    "src/minimax_h3_prompt/segment_planner.py",
    "src/minimax_h3_prompt/director/frames.py",
    "src/minimax_h3_prompt/tools/ref_metadata.py",
    "src/minimax_h3_prompt/tools/frame_auditor.py",
    "src/minimax_h3_prompt/stage2_checkpoint.py",
    "src/minimax_h3_prompt/summary.py",
    "src/minimax_h3_prompt/asset_proofread.py",
    "src/minimax_h3_prompt/graph/pipeline.py",
    "src/minimax_h3_prompt/model_factory.py",
    "src/minimax_h3_prompt/main.py",
    # 第三批（2026-11-02）：外部命令、读图、导演台写段、台账与段账。
    "src/minimax_h3_prompt/tools/seam_audit.py",
    "src/minimax_h3_prompt/tools/reference_auditor.py",
    "src/minimax_h3_prompt/director/prompts.py",
    "src/minimax_h3_prompt/asset_ledger.py",
    "src/minimax_h3_prompt/shot_ledger.py",
    "src/minimax_h3_prompt/segment_prompts.py",
    "src/minimax_h3_prompt/project_models.py",
    # 第四批（2026-11-02）：角色装配与产物模型。
    "src/minimax_h3_prompt/agents/__init__.py",
    "src/minimax_h3_prompt/generation.py",
    # 第五批（2026-11-02）：管线节点。
    "src/minimax_h3_prompt/graph/nodes.py",
]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
# 体检 P6：覆盖率先只做**度量**，不设门槛——本仓的历史基线没有，设 fail_under
# 只会逼人写凑数用例。改了哪几行、哪几行没测到，才是评审要看的东西。
# 安装由用户本人执行：uv add --dev coverage
source = ["src/minimax_h3_prompt"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise SystemExit",
]

[tool.ruff]
# retro 2026-10-31：把机械风格/导入错误交给确定性工具，不再只靠复审子代理。
# 只查 src/；tests/ 的规则先跑通再扩（tests/ 已于 2026-11-02 入库）。规则先取 pyflakes（F）——它抓未定义名、
# 未使用导入这类真错误，不会像 E501 那样一次刷满全仓历史文件。
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["F"]
