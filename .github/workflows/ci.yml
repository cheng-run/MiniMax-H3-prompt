name: CI

# 为什么有这个工作流（体检 P0-2，2026-11-02）：此前 docs/tests/scripts 不入库，
# 唯一的守卫是 scripts/check.sh，而它只活在本机 `.git/hooks` 里。换机器、换会话、
# 干净检出都没有约束，「本机全绿」于是成了唯一证据——而它不能当反证。
# 这里把同一套命令搬到每次 push / PR 上，让「绿」变成任何机器都能复现的事实。
#
# 不做的事：不跑真实 ComfyUI/网关/ffmpeg 联调（需要用户机器与密钥），
# 真实外部契约测试在后续阶段单独设计（见 docs/research/2026-11-02-项目体检.md §5）。

on:
  push:
    branches: [main]
  pull_request:

# 只读权限：CI 只验证，不写回仓库。
permissions:
  contents: read

# 同一分支的新提交取消旧的运行，避免排队烧时长。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows 是当前唯一支持平台：配置默认值带 D:\ 路径、向导要求 TTY。
    # 跨平台解耦是后续工作项（体检 P2-4）；先别让一个从没绿过的 job 常红。
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Windows runner 默认 cp1252：脚本里的中文输出会直接崩
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1

      # uv 负责解释器与锁文件：requires-python >= 3.14，由 setup-uv 现装。
      # 钉精确版本：该仓库只发语义化版本标签，没有 v10 这种移动主版本标签
      # （2026-11-02 第一次远端跑就是这么红的：unable to find version v10）。
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 安装依赖（严格按 uv.lock）
        run: uv sync --frozen

      # 与 scripts/check.sh 同源：结构守卫 → lint → 全量测试。
      # ruff 的 F 规则抓未定义名/未使用导入，是复审子代理漏掉的那类机械错误。
      - name: 结构守卫：docstring 不许写成 f-string
        run: uv run python scripts/check_docstring_shape.py src

      - name: lint（ruff）
        # tests/ 一起查：测试里也有未定义名、未使用导入这类机械错误。
        run: uv run python -m ruff check src tests scripts

      # 类型检查：2026-11-02 起全仓零错误。不进 CI 的守卫等于没有——
      # 之前 mypy 只在 check.sh 里，推送后没人再检查它。
      - name: 类型检查（mypy）
        run: uv run python -m mypy

      - name: 全量测试
        run: uv run python -m pytest -q

      # 守卫变异检验（体检 P6）：把关键实现改坏，指定的守卫用例必须变红。
      # 「永不为红＝没有」——不做这一步，没人知道新守卫是不是摆设。
      - name: 守卫变异检验
        run: uv run python scripts/mutation_check.py

  # 前端质量门禁（D1-6，#211）：契约 drift、lint、格式、类型、单测+覆盖率、构建全过。
  frontend-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 安装 Python 依赖（严格按 uv.lock）
        run: uv sync --frozen

      # 契约唯一真源是 Python：重新导出后必须与入库文件逐字节一致，否则类型会静默分叉。
      - name: 导出 OpenAPI 并检查 drift
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code contracts/openapi.json

      - uses: pnpm/action-setup@v4.4.0
        with:
          # 从 frontend/package.json 的 packageManager 读取 pnpm 版本，避免第二处硬编码。
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖（frozen lockfile）
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 重新生成类型，必须与入库的 generated.ts 一致——手改生成文件会被这里抓住。
      - name: 重新生成 API 类型并检查 drift
        working-directory: frontend
        run: |
          pnpm run openapi
          git -C .. diff --exit-code frontend/src/api/generated.ts

      - name: lint
        working-directory: frontend
        run: pnpm run lint

      - name: 格式检查
        working-directory: frontend
        run: pnpm run format:check

      - name: 类型检查（vue-tsc）
        working-directory: frontend
        run: pnpm run typecheck

      # e2e 不在主 tsconfig 的 include 里（retro 2026-11-10）：Playwright 只转译不查类型，
      # 这里用独立的 tsconfig.e2e.json 补上。
      - name: 类型检查（e2e）
        working-directory: frontend
        run: pnpm run typecheck:e2e

      - name: 单测 + 组件测试 + 覆盖率门禁
        working-directory: frontend
        run: pnpm run coverage

      - name: 生产构建
        working-directory: frontend
        run: pnpm run build

  # 真实浏览器 E2E（D1-6，#211）：真实构建产物 + 真实 FastAPI 同源托管。
  # Windows 是当前唯一支持平台，不能用 Linux 绿替代真实平台证据。
  frontend-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 安装 Python 依赖（严格按 uv.lock）
        run: uv sync --frozen

      - uses: pnpm/action-setup@v4.4.0
        with:
          # 从 frontend/package.json 的 packageManager 读取 pnpm 版本，避免第二处硬编码。
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖（frozen lockfile）
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 构建前端产物
        working-directory: frontend
        run: pnpm run build

      - name: 缓存 Playwright chromium
        uses: actions/cache@v4.3.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: 安装 Playwright chromium（不加 --with-deps）
        working-directory: frontend
        run: pnpm exec playwright install chromium

      - name: E2E
        working-directory: frontend
        run: pnpm run e2e

      - name: 失败时上传 Playwright 报告
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  # EXE 打包流水线（D5-6 / #241，spec #235 §9 / D5-AC13）：真实交付形态的构建 +
  # 冻结自检 + artifact。PyInstaller 要打 langchain/langgraph/deepagents 全家桶，
  # 时间给足；**失败必须让构建变红**——不加 continue-on-error，artifact 只在自检
  # 通过后才上传。
  exe-build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 安装 Python 依赖（严格按 uv.lock）
        run: uv sync --frozen

      - uses: pnpm/action-setup@v4.4.0
        with:
          # 从 frontend/package.json 的 packageManager 读取 pnpm 版本，避免第二处硬编码。
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: frontend/.node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 安装前端依赖（frozen lockfile）
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # 一条命令：前端构建 → PyInstaller（onedir）→ 目录 + 同名 zip。
      - name: 构建 EXE 与 zip
        run: uv run python scripts/build_exe.py

      # 冻结后自检：冻结环境、ffmpeg、桩管线阶段 1/2（退出码即判据）。
      # 交付形态是 --windowed，没有控制台，所以报告落文件再由下一步打出来。
      - name: 冻结产物自检
        run: build-exe/MiniMax-H3-prompt/MiniMax-H3-prompt.exe --self-check --data-root build-exe/selfcheck-data

      - name: 输出自检报告
        if: always()
        run: |
          if (Test-Path build-exe/selfcheck-data/selfcheck.log) {
            Get-Content -Encoding utf8 build-exe/selfcheck-data/selfcheck.log
          }

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: MiniMax-H3-prompt-exe
          path: build-exe/MiniMax-H3-prompt.zip
          if-no-files-found: error
          retention-days: 7
